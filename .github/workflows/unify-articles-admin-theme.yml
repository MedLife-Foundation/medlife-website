name: Unify Articles Admin Theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-articles-admin-theme.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply official MedLife admin theme
        shell: python
        run: |
          from pathlib import Path

          path = Path('articles-admin.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace('--n:#17213b;--r:#e91e4d;', '--n:#10233f;--r:#e51f45;--n2:#17345a;')
          html = html.replace('background:#fffffff5;backdrop-filter:blur(14px);', 'background:linear-gradient(135deg,var(--n),var(--n2));color:#fff;')
          html = html.replace('.brand p{margin:2px 0 0;color:var(--m);font-size:11px}', '.brand p{margin:2px 0 0;color:#b9c8d9;font-size:11px}')
          html = html.replace('.brand img{width:50px;height:50px;object-fit:contain}', '.brand img{width:50px;height:50px;object-fit:contain;background:#fff;border-radius:14px;padding:5px}')

          if 'العودة إلى لوحة الإدارة' not in html:
              marker = '<div class="actions">'
              if marker in html:
                  html = html.replace(marker, marker + '<a class="medlife-back-admin" href="/admin/">العودة إلى لوحة الإدارة</a>', 1)
              else:
                  html = html.replace('<body>', '<body><a class="medlife-back-admin medlife-back-fallback" href="/admin/">العودة إلى لوحة الإدارة</a>', 1)

          if 'medlife-admin-theme-v1' not in html:
              css = '''<style id="medlife-admin-theme-v1">
          .medlife-back-admin{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 14px;border:1px solid rgba(255,255,255,.28);border-radius:11px;background:#fff;color:#10233f;text-decoration:none;font:800 10px Cairo,Arial,sans-serif;white-space:nowrap;transition:.18s ease}
          .medlife-back-admin:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,35,63,.16)}
          .medlife-back-fallback{position:fixed;top:16px;inset-inline-start:16px;z-index:9999}
          @media(max-width:720px){.medlife-back-admin{width:100%}.medlife-back-fallback{width:auto}}
          </style>'''
              html = html.replace('</head>', css + '</head>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles-admin.html
          git diff --cached --quiet && exit 0
          git commit -m "style(admin): unify editorial studio with MedLife theme"
          git push
