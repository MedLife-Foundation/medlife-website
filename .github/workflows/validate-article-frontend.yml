name: Validate article frontend
on:
  push:
    branches: ["main"]
    paths:
      - "articles.html"
      - "article-reader-v8.html"
      - "submit-article-v6.html"
      - "submit-article-v6.js"
      - "functions/articles/**"
      - "functions/api/management.js"
      - ".github/workflows/validate-article-frontend.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "articles.html"
      - "article-reader-v8.html"
      - "submit-article-v6.html"
      - "submit-article-v6.js"
      - "functions/articles/**"
      - "functions/api/management.js"
      - ".github/workflows/validate-article-frontend.yml"

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check inline scripts in article pages
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const htmlFiles = [
            "articles.html",
            "article-reader-v8.html",
            "submit-article-v6.html",
          ];

          let failed = false;
          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, "utf8");
            const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script\s*>/gi)]
              .map((match) => match[1])
              .filter((script) => script.trim());

            scripts.forEach((script, index) => {
              try {
                new Function(script);
                console.log("OK:", file, "inline script", index + 1);
              } catch (error) {
                failed = true;
                console.error("ERROR:", file, "inline script", index + 1, error.message);
              }
            });
          }

          try {
            new Function(fs.readFileSync("submit-article-v6.js", "utf8"));
            console.log("OK: submit-article-v6.js");
          } catch (error) {
            failed = true;
            console.error("ERROR: submit-article-v6.js", error.message);
          }

          if (failed) process.exit(1);
          NODE

      - name: Check Cloudflare Pages function modules
        run: |
          node --input-type=module --check < "functions/articles/[slug].js"
          node --input-type=module --check < "functions/api/management.js"
