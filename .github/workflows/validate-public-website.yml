name: Validate Public Website Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public website ownership
        shell: python
        run: |
          from pathlib import Path

          required = [
              "index.html",
              "articles.html",
              "login.html",
              "site-nav.js",
              "functions/_middleware.js",
              "functions/articles/[slug].js",
              "_redirects",
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f"Missing required public website files: {missing}")

          middleware = Path("functions/_middleware.js").read_text(encoding="utf-8")
          site_nav = Path("site-nav.js").read_text(encoding="utf-8")
          articles = Path("articles.html").read_text(encoding="utf-8")
          reader = Path("functions/articles/[slug].js").read_text(encoding="utf-8")
          redirects = Path("_redirects").read_text(encoding="utf-8")
          login = Path("login.html").read_text(encoding="utf-8")

          if "isArticlesAdmin" in middleware:
              raise SystemExit("Public middleware still contains legacy Articles Admin ownership.")
          if "articles-library-canonical.js" in middleware:
              raise SystemExit("Public article library still injects the legacy D1 article source.")
          if "const currentPage" not in site_nav or "normalizedPath" not in site_nav:
              raise SystemExit("Global navigation is missing canonical route normalization.")
          if "/api/management?resource=content" not in articles:
              raise SystemExit("Public article library is not connected to the management publication API.")
          if "/api/articles" in articles:
              raise SystemExit("Public article library still references the legacy D1 article API.")
          if 'management-platform' not in reader:
              raise SystemExit("Public article reader is not marked as management-platform sourced.")
          if "/articles/" not in reader:
              raise SystemExit("Public article reader canonical route is missing.")
          if "/admin/* https://admin.medlifesy.org/ 301" not in redirects:
              raise SystemExit("Legacy nested admin routes are not redirected to the canonical admin platform.")
          if "https://admin.medlifesy.org/login" not in login:
              raise SystemExit("Public login entry is not connected to the canonical management login.")

          print("Public website ownership and integration validated successfully.")

      - name: Syntax check public runtime
        run: |
          node --check site-nav.js
          node --check functions/_middleware.js
          node --check functions/articles/[slug].js
