name: Validate Public Article System

on:
  push:
    branches:
      - main
      - feat/article-management-reading-experience
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public article infrastructure
        shell: python
        run: |
          from pathlib import Path

          required = [
              'articles.html',
              'functions/_middleware.js',
              'functions/articles/[slug].js',
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f'Missing required public article files: {missing}')

          middleware = Path('functions/_middleware.js').read_text(encoding='utf-8')
          if '/article-reader-rich-content.js' not in middleware:
              raise SystemExit('Middleware does not inject article-reader-rich-content.js')

          print('Public article infrastructure validated successfully.')
          print('Legacy Article Admin / Editorial Studio validation has been retired.')
