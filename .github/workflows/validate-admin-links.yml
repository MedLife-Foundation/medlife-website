name: Validate Admin Navigation

on:
  push:
    paths:
      - 'admin.html'
      - 'admin-v2.html'
      - 'admin-members-v3.html'
      - 'articles-admin.html'
      - 'admin-teams.html'
      - 'admin-telegram.html'
      - '_redirects'
      - '.github/workflows/validate-admin-links.yml'
  pull_request:
    paths:
      - 'admin.html'
      - 'admin-v2.html'
      - 'admin-members-v3.html'
      - 'articles-admin.html'
      - 'admin-teams.html'
      - 'admin-telegram.html'
      - '_redirects'
      - '.github/workflows/validate-admin-links.yml'

jobs:
  validate-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate internal admin links
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          page = Path('admin-v2.html').read_text(encoding='utf-8')
          hrefs = re.findall(r'''href=["']([^"']+)["']''', page, flags=re.I)
          ignored = ('#', 'javascript:', 'mailto:', 'tel:', 'http://', 'https://')
          errors = []

          for href in hrefs:
              href = href.split('#', 1)[0].split('?', 1)[0]
              if not href or href.startswith(ignored):
                  continue

              target = Path(href.lstrip('/')) if href.startswith('/') else Path(href)
              candidates = [target]
              if target.suffix == '':
                  candidates.append(Path(f'{target}.html'))
                  candidates.append(target / 'index.html')

              if not any(candidate.exists() for candidate in candidates):
                  errors.append(f'Missing internal target: {href} -> {candidates}')

          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)

          print(f'OK: validated {len(hrefs)} admin hrefs; all internal targets exist or resolve to native Pages HTML routes.')
          PY

      - name: Validate canonical admin redirect
        run: |
          grep -Eq '^/admin\.html[[:space:]]+/admin-v2[[:space:]]+301$' _redirects
          echo 'OK: /admin.html redirects to /admin-v2'
