name: Validate Admin Navigation

on:
  push:
    paths:
      - 'admin.html'
      - 'admin-accounts.html'
      - 'members-admin.html'
      - 'articles-admin.html'
      - 'admin/editorial-command-center-v24.html'
      - 'admin-teams.html'
      - 'admin-telegram.html'
      - '_redirects'
      - '.github/workflows/validate-admin-links.yml'
  pull_request:
    paths:
      - 'admin.html'
      - 'admin-accounts.html'
      - 'members-admin.html'
      - 'articles-admin.html'
      - 'admin/editorial-command-center-v24.html'
      - 'admin-teams.html'
      - 'admin-telegram.html'
      - '_redirects'
      - '.github/workflows/validate-admin-links.yml'

jobs:
  validate-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate internal admin links
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          pages = [
              Path('admin.html'),
              Path('admin-accounts.html'),
              Path('members-admin.html'),
              Path('articles-admin.html'),
              Path('admin/editorial-command-center-v24.html'),
              Path('admin-teams.html'),
              Path('admin-telegram.html'),
          ]

          missing_pages = [str(page) for page in pages if not page.is_file()]
          if missing_pages:
              raise SystemExit('Missing validation pages: ' + ', '.join(missing_pages))

          ignored = ('#', 'javascript:', 'mailto:', 'tel:', 'http://', 'https://')
          errors = []

          for page in pages:
              hrefs = re.findall(r'''href=["']([^"']+)["']''', page.read_text(encoding='utf-8'), flags=re.I)
              for href in hrefs:
                  href = href.split('#', 1)[0].split('?', 1)[0]
                  if not href or href.startswith(ignored):
                      continue

                  target = Path(href.lstrip('/')) if href.startswith('/') else (page.parent / href)
                  candidates = [target]
                  if target.suffix == '':
                      candidates.extend([Path(f'{target}.html'), target / 'index.html'])

                  if not any(candidate.is_file() for candidate in candidates):
                      errors.append(f'{page}: missing internal target {href} -> {candidates}')

          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)

          print(f'OK: validated {len(pages)} admin entrypoints; all internal static targets exist.')
          PY

      - name: Validate admin route contract
        run: |
          grep -Eq '^/admin-members[[:space:]]+/members-admin\.html[[:space:]]+301 _redirects
          grep -Eq '^/admin-members/\s+/members-admin\.html[[:space:]]+301 _redirects
          grep -Eq '^/articles-admin[[:space:]]+/admin/editorial-command-center-v24\.html[[:space:]]+200 _redirects
          grep -Eq '^/articles-admin/\s+/admin/editorial-command-center-v24\.html[[:space:]]+200 _redirects
          grep -Eq '^/articles-admin\.html[[:space:]]+/admin/editorial-command-center-v24\.html[[:space:]]+200 _redirects
          if grep -Eq '[[:space:]]+(/admin-v2\.html|/admin-members-v3(\.html)?|/articles-admin-v2\.html)([[:space:]]|$)' _redirects; then
            echo 'Stale admin redirect target detected in _redirects'
            exit 1
          fi
          echo 'OK: admin redirect targets match existing entrypoints.'
