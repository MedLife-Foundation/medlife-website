name: Remove Article Reader URL Rewrite

on:
  push:
    branches: [main]
    paths:
      - 'article-reader-v5.html'
      - 'tests/articles-canonical.test.js'
      - '.github/workflows/remove-reader-url-rewrite.yml'

permissions:
  contents: write

jobs:
  patch-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Reader renderer-only
        shell: python
        run: |
          from pathlib import Path
          path = Path('article-reader-v5.html')
          text = path.read_text(encoding='utf-8')
          old = "history.replaceState({},'', '/articles/'+slugify(title));"
          new = "// Canonical URL is owned by the /articles/[slug] route; the reader never rewrites it."
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate Reader and routing contract
        run: node tests/articles-canonical.test.js

      - name: Commit renderer-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article-reader-v5.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(articles): keep reader renderer-only"
          git push

# Canonical routing enforcement v2
