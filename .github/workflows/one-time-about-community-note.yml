name: One-time About community note

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update About page
        shell: python
        run: |
          from pathlib import Path
          page = Path('about-medlife.html')
          text = page.read_text(encoding='utf-8')
          old = '''لا نملك حتى الآن مادة مستقلة كافية تسمح بوصف «رأي الشارع السوري» أو «الرأي العالمي» تجاه ميدلايف بشكل عام؛ لذلك لن ننسب آراء عامة لمصادر أو أشخاص من دون توثيق. يمكن توسيع هذا القسم لاحقاً بإضافة مقابلات واستبيانات وشهادات منشورة من متطوعين ومستفيدين وشركاء.'''
          new = '''نسعى إلى توثيق مزيد من الشهادات والانطباعات من المتطوعين والمستفيدين والشركاء مع توسّع حضور ميدلايف.'''
          if old in text:
              text = text.replace(old, new, 1)
              page.write_text(text, encoding='utf-8')
          else:
              print('Community disclaimer already removed or not found.')

      - name: Commit and remove this temporary workflow
        shell: bash
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add about-medlife.html .github/workflows/one-time-about-community-note.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(about): refine community voices note'
          git rm .github/workflows/one-time-about-community-note.yml
          git commit -m 'chore: remove temporary About workflow'
          git push
