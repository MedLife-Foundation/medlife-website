name: Finalize Support navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: support-navigation-fix
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add support sub-navigation
        shell: python
        run: |
          from pathlib import Path
          page = Path('support.html')
          text = page.read_text(encoding='utf-8')
          tag = '<script src="/site-nav.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '\n</body>', 1)
          text = page.read_text(encoding='utf-8')
          if tag not in text:
              raise SystemExit('shared navigation loader was not added')
          page.write_text(text, encoding='utf-8')

      - name: Extend shared navigation for Support
        shell: python
        run: |
          from pathlib import Path
          page = Path('site-nav.js')
          text = page.read_text(encoding='utf-8')
          old = "    if (page === 'forum-v3' || page === 'forum-v3.html') return 'forum';\n    const match"
          new = "    if (page === 'forum-v3' || page === 'forum-v3.html') return 'forum';\n    if (page === 'support' || page === 'support.html') return 'support';\n    const match"
          if old not in text:
              raise SystemExit('support active route pattern not found')
          text = text.replace(old, new, 1)

          old2 = "    if (page === 'gallery' || page === 'gallery.html') {\n      document.querySelectorAll('body > header.gallery-legacy-header, body > header:not(.medlife-global-header)').forEach(el => el.remove());\n    }"
          new2 = old2 + "\n    if (page === 'support' || page === 'support.html') {\n      document.querySelectorAll('body > header:not(.medlife-global-header)').forEach(el => el.remove());\n    }"
          if old2 not in text:
              raise SystemExit('legacy header pattern not found')
          text = text.replace(old2, new2, 1)

          marker = "    if (current === 'forum') {"
          support = r'''    if (current === 'support') {
      const sub = document.createElement('nav');
      sub.className = 'medlife-section-subnav medlife-support-subnav';
      sub.setAttribute('aria-label', 'تنقل صندوق الدعم');
      sub.innerHTML = `
        <div class="medlife-section-subnav-inner">
          <a href="#request" data-support-key="request">تقديم طلب مساعدة</a>
          <a href="#cases" data-support-key="cases">استعراض الحالات</a>
          <a href="#support" data-support-key="support">تقديم دعم</a>
        </div>`;
      header.insertAdjacentElement('afterend', sub);

      const style = document.createElement('style');
      style.id = 'medlife-support-subnav-style';
      style.textContent = `
        .medlife-section-subnav{position:sticky;top:72px;z-index:2400;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #e8edf3;box-shadow:0 5px 15px rgba(21,29,54,.045);animation:medlifeSectionSubnavIn .28s ease-out both}
        .medlife-section-subnav-inner{width:min(1180px,calc(100% - 28px));min-height:48px;margin:auto;display:flex;align-items:stretch;justify-content:center;gap:3px;overflow-x:auto;scrollbar-width:none}
        .medlife-section-subnav-inner::-webkit-scrollbar{display:none}
        .medlife-section-subnav-inner a{position:relative;display:flex;align-items:center;justify-content:center;padding:0 16px;color:#151d36;text-decoration:none;font:800 12px Cairo,sans-serif;white-space:nowrap;transition:color .2s ease,background .2s ease}
        .medlife-section-subnav-inner a::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;border-radius:999px;background:#ff2a54;transform:scaleX(0);transition:transform .2s ease}
        .medlife-section-subnav-inner a:hover{color:#ff2a54;background:#fff8fa;border-radius:8px}
        .medlife-section-subnav-inner a.active{color:#ff2a54}
        .medlife-section-subnav-inner a.active::after{transform:scaleX(1)}
        @keyframes medlifeSectionSubnavIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
        @media(max-width:700px){.medlife-section-subnav{top:64px}.medlife-section-subnav-inner{justify-content:flex-start}.medlife-section-subnav-inner a{padding:0 13px;font-size:11px}}
      `;
      document.head.appendChild(style);

      const links = [...sub.querySelectorAll('[data-support-key]')];
      const setSupportActive = key => links.forEach(a => a.classList.toggle('active', a.dataset.supportKey === key));
      const requestButton = document.getElementById('heroRequest');
      const supportTarget = document.getElementById('support');
      links.find(a => a.dataset.supportKey === 'request')?.addEventListener('click', e => {
        if (requestButton) { e.preventDefault(); requestButton.click(); }
      });
      const sections = links.map(a => [a.getAttribute('href').slice(1), a.dataset.supportKey]);
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver(entries => {
          const visible = entries.filter(entry => entry.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
          if (visible) setSupportActive(visible.target.dataset.supportKey);
        }, {rootMargin:'-26% 0px -58% 0px', threshold:[0,.2,.5,.8]});
        sections.forEach(([id,key]) => {
          const el = document.getElementById(id);
          if (el) { el.dataset.supportKey = key; observer.observe(el); }
        });
      }
      setSupportActive('cases');
      links.forEach(a => a.addEventListener('click', () => setSupportActive(a.dataset.supportKey)));
    }

'''
          if "medlife-support-subnav-style" not in text:
              if marker not in text:
                  raise SystemExit('forum marker not found')
              text = text.replace(marker, support + marker, 1)
          page.write_text(text, encoding='utf-8')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          support = Path('support.html').read_text(encoding='utf-8')
          nav = Path('site-nav.js').read_text(encoding='utf-8')
          assert '<script src="/site-nav.js"></script>' in support
          assert "page === 'support' || page === 'support.html'" in nav
          assert 'تقديم طلب مساعدة' in nav and 'استعراض الحالات' in nav and 'تقديم دعم' in nav

      - name: Commit with rebase-safe push and cleanup
        shell: bash
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add support.html site-nav.js
          if git diff --cached --quiet; then
            echo 'No support navigation changes detected'
            exit 1
          fi
          git commit -m 'fix(support): unify navigation and add support subnav'
          git fetch origin main
          git rebase origin/main
          git rm --ignore-unmatch .github/workflows/finalize-support-nav.yml
          git commit -m 'chore: remove temporary support navigation workflow' || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
