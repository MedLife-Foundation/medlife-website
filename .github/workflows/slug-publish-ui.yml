name: Add article publish slug selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/slug-publish-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch article API and admin publish UI
        shell: python
        run: |
          from pathlib import Path
          worker=Path('workers/articles-api/worker.js'); text=worker.read_text(encoding='utf-8')
          old="let b=await req.json(),articleSlug=await uniqueSlug(env.DB,b.title_ar||b.title_en||'article');"
          new="let b=await req.json(),articleSlug=await uniqueSlug(env.DB,b.slug||b.title_ar||b.title_en||'article');"
          if old in text and new not in text: text=text.replace(old,new,1)
          marker="if(p[1]&&req.method==='PUT'){let b=await req.json();"
          if marker in text and 'const requestedSlug=await uniqueSlug' not in text:
            replacement=marker+"const current=await env.DB.prepare('SELECT slug FROM articles WHERE id=?').bind(p[1]).first();const requestedSlug=b.slug?await uniqueSlug(env.DB,b.slug,p[1]):(current?.slug||await uniqueSlug(env.DB,b.title_ar||b.title_en||'article',p[1]));"
            text=text.replace(marker,replacement,1)
            needle="return json(await env.DB.prepare('SELECT * FROM articles WHERE id=?').bind(p[1]).first())"
            if needle in text: text=text.replace(needle,"await env.DB.prepare('UPDATE articles SET slug=?,updated_at=CURRENT_TIMESTAMP WHERE id=?').bind(requestedSlug,p[1]).run();"+needle,1)
          worker.write_text(text,encoding='utf-8')
          page=Path('articles-admin.html'); html=page.read_text(encoding='utf-8')
          if 'medlife-publish-slug-v1' not in html:
            patch=r'''<style id="medlife-publish-slug-v1">#medlifePublishSlugModal{display:none;position:fixed;inset:0;z-index:99999;background:rgba(8,18,40,.68);align-items:center;justify-content:center;padding:18px}#medlifePublishSlugModal.on{display:flex}#medlifePublishSlugBox{width:min(620px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.25);font-family:Cairo,Arial,sans-serif}#medlifePublishSlugBox h2{margin:0 0 7px;color:#10233f;font-size:22px}#medlifePublishSlugBox p{margin:0 0 15px;color:#667085;font-size:12px;line-height:1.9}#medlifePublishSlugBox .ml-slug-preview{display:flex;align-items:center;gap:4px;background:#f7f9fc;border:1px solid #e2e8f0;border-radius:12px;padding:11px 13px;margin-bottom:10px;color:#667085;font-size:12px;direction:ltr}#medlifePublishSlugBox .ml-slug-preview strong{color:#10233f}#medlifePublishSlugBox label{display:block;font-size:11px;font-weight:900;color:#10233f;margin:12px 0 6px}#medlifePublishSlugBox input{width:100%;box-sizing:border-box;border:1px solid #d8e0ea;border-radius:12px;padding:12px 13px;font:700 13px Cairo,Arial,sans-serif;outline:none}#medlifePublishSlugBox .ml-slug-help{margin-top:7px;font-size:10px;color:#667085}#medlifePublishSlugBox .ml-slug-status{min-height:18px;margin-top:8px;font-size:10px;font-weight:800}#medlifePublishSlugBox .ml-slug-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}#medlifePublishSlugBox button{border:1px solid #e2e8f0;background:#fff;color:#10233f;border-radius:11px;padding:10px 14px;font:800 11px Cairo,Arial,sans-serif;cursor:pointer}#medlifePublishSlugBox button.primary{background:#087f5b;border-color:#087f5b;color:#fff}</style><div id="medlifePublishSlugModal" aria-hidden="true"><div id="medlifePublishSlugBox" role="dialog" aria-modal="true"><h2>🚀 نشر المقالة</h2><p>كل مقالة منشورة في MedLife يجب أن تمتلك رابطاً دائماً وفريداً. يمكنك اقتراح اسم الرابط أو تركه فارغاً ليتم إنشاؤه تلقائياً.</p><div class="ml-slug-preview"><span>https://medlifesy.org/articles/</span><strong id="medlifeSlugPreview">—</strong></div><label for="medlifePublishSlug">اسم الرابط (Slug)</label><input id="medlifePublishSlug" autocomplete="off" placeholder="مثال: family-planning"><div class="ml-slug-help">استخدم حروفاً وأرقاماً وشرطة (-). إذا كان الاسم مستخدماً سيُضاف رمز فريد تلقائياً.</div><div id="medlifeSlugStatus" class="ml-slug-status"></div><div class="ml-slug-actions"><button id="medlifeSlugCancel">إلغاء</button><button id="medlifeSlugPublish" class="primary">نشر بالمسمى المحدد</button></div></div></div><script id="medlife-publish-slug-v1">(function(){const m=document.getElementById('medlifePublishSlugModal'),i=document.getElementById('medlifePublishSlug'),p=document.getElementById('medlifeSlugPreview'),s=document.getElementById('medlifeSlugStatus'),go=document.getElementById('medlifeSlugPublish'),no=document.getElementById('medlifeSlugCancel'),b=document.getElementById('publish');if(!m||!i||!go||!b)return;const clean=v=>String(v||'').trim().toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70),title=()=>String(document.getElementById('title')?.value||'').trim(),def=()=>clean(title())||('article-'+Date.now().toString(36)),refresh=()=>{const x=clean(i.value)||def();p.textContent=x;s.textContent=i.value.trim()?'سيتم استخدام هذا الاسم كرابط دائم.':'سيتم إنشاء الرابط تلقائياً من عنوان المقال.'};i.addEventListener('input',refresh);const close=()=>{m.classList.remove('on');m.setAttribute('aria-hidden','true')};no.addEventListener('click',close);m.addEventListener('click',e=>{if(e.target===m)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&m.classList.contains('on'))close()});b.addEventListener('click',e=>{if(window.__medlifePublishSlugConfirmed){window.__medlifePublishSlugConfirmed=false;return}e.preventDefault();e.stopImmediatePropagation();i.value='';refresh();m.classList.add('on');m.setAttribute('aria-hidden','false');setTimeout(()=>i.focus(),30)},true);const nf=window.fetch.bind(window);window.fetch=function(r,o){const x=window.__medlifePublishSlug;if(!x||!o?.body)return nf(r,o);try{const method=String(o.method||'GET').toUpperCase();if(!['POST','PUT','PATCH'].includes(method))return nf(r,o);const body=typeof o.body==='string'?JSON.parse(o.body):null;if(!body||body.status!=='published')return nf(r,o);body.slug=x;window.__medlifePublishSlug=null;return nf(r,{...o,body:JSON.stringify(body),headers:{...(o.headers||{}),'Content-Type':'application/json'}})}catch(_){return nf(r,o)}};go.addEventListener('click',()=>{const x=clean(i.value)||def();window.__medlifePublishSlug=x;window.__medlifePublishSlugConfirmed=true;close();b.click()})})();</script>'''
            html=html.replace('</body>',patch+'\n</body>'); page.write_text(html,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add workers/articles-api/worker.js articles-admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(articles): add permanent publish slug selector'
          git push
