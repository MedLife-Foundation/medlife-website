name: Fix forum navigation loader

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: forum-navigation-fix
  cancel-in-progress: false

jobs:
  update-forum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Forum V3
        shell: python
        run: |
          from pathlib import Path
          page = Path('forum-v3.html')
          text = page.read_text(encoding='utf-8')
          tag = '<script src="/site-nav.js"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('forum-v3.html has no closing body tag')
              text = text.replace('</body>', tag + '\n</body>', 1)
              page.write_text(text, encoding='utf-8')
          text = page.read_text(encoding='utf-8')
          if text.count(tag) != 1:
              raise SystemExit(f'Expected one shared navigation loader, found {text.count(tag)}')

      - name: Commit with rebase-safe push and cleanup
        shell: bash
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'

          git add forum-v3.html
          git commit -m 'fix(forum): load shared global navigation'

          git fetch origin main
          git rebase origin/main

          git rm --ignore-unmatch .github/workflows/fix-forum-loader.yml
          git rm --ignore-unmatch .github/workflows/finalize-forum-nav.yml
          git rm --ignore-unmatch .github/workflows/update-forum-subnav.yml
          git commit -m 'chore(forum): remove temporary navigation workflows' || true

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; git add forum-v3.html; git commit -m 'fix(forum): load shared global navigation' || true; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
