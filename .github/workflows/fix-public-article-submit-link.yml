name: Fix public article submission link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-public-article-submit-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch public articles page
        shell: python
        run: |
          from pathlib import Path
          p = Path('articles.html')
          html = p.read_text(encoding='utf-8')

          # Remove accidental admin destination from any public submission CTA.
          html = html.replace('href="/articles-admin"', 'href="/submit-article"')
          html = html.replace("href='/articles-admin'", "href='/submit-article'")
          html = html.replace('href="articles-admin.html"', 'href="/submit-article"')

          guard = '''<script id="medlife-public-submit-guard">\n(() => {\n  document.addEventListener('click', (event) => {\n    const link = event.target.closest && event.target.closest('a');\n    if (!link) return;\n    const raw = link.getAttribute('href') || '';\n    if (/^(?:https?:\\/\\/[^/]+)?\\/?articles-admin(?:\\.html)?(?:\\/)?(?:[?#].*)?$/i.test(raw)) {\n      event.preventDefault();\n      event.stopImmediatePropagation();\n      window.location.assign('/submit-article');\n    }\n  }, true);\n})();\n</script>'''

          if 'id="medlife-public-submit-guard"' not in html:
              html = html.replace('</body>', guard + '\n</body>')

          p.write_text(html, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add articles.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(public): prevent article submission from opening admin'
          git push
